{% extends "base.html" %}

{% block content %}
<h2>Supprimer "{{ post.title }}" ?</h2>

<p>Êtes-vous sûr de vouloir supprimer cet article ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-primary">Oui, supprimer</button>
</form>

<p><a href="{% url 'post_list' %}">Annuler</a></p>
{% endblock %}
